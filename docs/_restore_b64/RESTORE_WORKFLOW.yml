name: restore-design-doc
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/_restore_b64/**'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-mode-territory-map
      - name: Assemble design doc from base64 parts
        run: |
          set -euo pipefail
          bash docs/_restore_b64/assemble.sh
      - name: Commit restored design doc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Eldrathor_Design_Doc.md
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m "Restore full Eldrathor_Design_Doc.md with dual-mode art lock"
          git push
